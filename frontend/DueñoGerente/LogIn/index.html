<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Login</title>
</head>

<body>

  <div class="login-container">

    <!-- COLUMNA IZQUIERDA - IMAGEN -->
    <div class="left">
      <img src="../img/LogIn/LogIn.png" class="left-img" alt="Login image">
    </div>

    <!-- COLUMNA DERECHA - FORM -->
    <div class="right">

      <!-- Logo -->
      <img src="../img/LogIn/logo.png" class="logo" alt="Logo">

      <!-- Título -->
      <h1 class="title">Nice to see you again</h1>

      <!-- FORMULARIO -->
      <div class="form-group">
        <label class="label">Login</label>
        <input type="text" placeholder="Email or phone number">
      </div>

      <div class="form-group">
        <label class="label">Password</label>
        <div class="input-password">
          <input type="password" placeholder="Enter password">
          <img src="../img/LogIn/Eye.png" class="eye" alt="Show password">
        </div>
      </div>

      <!-- Forgot -->
      <a href="#" class="forgot">Forgot password?</a>

      <!-- BOTÓN (IMAGEN) -->
      <button class="btn-img">
        <img src="../img/LogIn/SignIn.png" alt="Sign in">
      </button>

      <!-- FOOTER -->
      <p class="footer">© Talk & Go 2025</p>

    </div>

  </div>

</body>
</html>
