<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="log-in">
      <div class="frame">
        <div class="sign-in-forms">
          <div class="sign-in-form-web">
            <div class="div">
              <p class="element">Nice to see you again</p>
              <div class="frame-2">
                <div class="frame-3">
                  <div class="input-configurator">
                    <div class="input-configurator-2">
                      <div class="satellite-input"><div class="hint">Login</div></div>
                      <div class="regular-input-double-wrapper">
                        <div class="regular-input-double">
                          <div class="placeholder-value">
                            <div class="frame-4"><div class="text-wrapper">Email or phone number</div></div>
                          </div>
                          <img class="input-icons" src="img/image.svg" />
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="input-configurator">
                    <div class="input-configurator-2">
                      <div class="satellite-input"><div class="hint">Password</div></div>
                      <div class="regular-input-double-wrapper">
                        <div class="regular-input-double">
                          <div class="placeholder-value">
                            <div class="frame-4"><div class="text-wrapper">Enter password</div></div>
                          </div>
                          <img class="img" src="img/input-icons.svg" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="description-wrapper"><div class="description">Forgot password?</div></div>
              </div>
            </div>
            <img class="primary-button" src="img/primary-button-40px.png" />
          </div>
        </div>
      </div>
      <div class="bottom-panel"><p class="head">© Talk &amp; Go 2025</p></div>
      <img class="rectangle" src="img/rectangle-2757.png" />
      <img class="sin-ttulo" src="img/sin-t-tulo-2-3.png" />
    </div>
  </body>
</html>
