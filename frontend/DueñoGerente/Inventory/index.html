<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />   
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="../img/logo.png" alt="Brew & Bagels" class="logo">
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="InventoryWindow()">Inventory</button>
                <button class="nav-btn inactive" onclick="EditRewardsWindow()">Rewards</button>
            </div>
        </div>

        <!-- Categories -->
        <div class="categories">
            <button class="category-btn active" data-category="1">Bagels</button>
            <button class="category-btn" data-category="2">Drinks</button>
            <button class="category-btn" data-category="3">Snacks</button>
            <button class="category-btn" data-category="4">Combos</button>

        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid">
           <!-- se  cargan con el js --> 
        </div>

        <!-- Add Product Button -->
        <button class="add-product-btn" onclick="addNewProduct()">
            <img src="../img/plus-circle.svg" alt="Add" class="add-icon">
            Add new product
        </button>
    </div>
</body>
<script src="script.js"></script>
</html>
