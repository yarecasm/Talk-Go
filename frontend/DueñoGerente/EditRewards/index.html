<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" /> 
</head>

<body>

  <!-- Modal -->
    <div class="modal-overlay" id="newValeModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <h2 class="modal-title">New vale</h2>
            
            <form>
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" placeholder="Name of the vale">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" placeholder="Full description of the vale"></textarea>
                    </div>

                    <div>
                        <div class="form-group">
                            <label class="form-label">Type of reward</label>
                            <select class="form-select">
                                <option>Select</option>
                                <option>FREE</option>
                                <option>Discount</option>
                                <option>2X1</option>
                                <option>3X2</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Points needed</label>
                            <input type="number" class="form-input" placeholder="0">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Associated product</label>
                        <select class="form-select">
                             <!-- Los productos se cargarán dinámicamente desde el backend -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
                            <label class="switch">
                                <input type="checkbox" id="estadoReward" checked>
                                <span class="slider"></span>
                            </label>
                            <span id="estadoLabel" style="font-size: 14px; color: #4CAF50;">Active</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="button" class="delete-button" id="deleteButton" onclick="eliminarRecompensa()">Delete</button>
                    </div>
                </div>

                
                <button type="submit" class="save-button">Save</button>
            </form>
        </div>
    </div>


    <!-- Pantalla principal -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="../img/logo.png" alt="Bagels & Bagels" class="logo">
            <div class="nav-buttons">
                <button class="nav-btn inactive" onclick="InventoryWindow()" >Inventory</button>
                <button class="nav-btn active" onclick="EditRewardsWindow()" >Rewards</button>
            </div>
        </div>

        <!-- Rewards Grid -->
        <div class="rewards-grid">
           <!-- Las tarjetas se cargarán dinámicamente desde el backend -->

            <!-- Add Reward -->
            <div class="add-reward-card" onclick="openModal()">
                <div class="add-icon-large">+</div>
            </div>
        </div>
    </div>

</body>
<script src="script.js"></script>
</html>
