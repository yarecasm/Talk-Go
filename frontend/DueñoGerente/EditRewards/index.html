<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" /> 
</head>

<body>

  <!-- Modal -->
    <div class="modal-overlay" id="newValeModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <h2 class="modal-title">New vale</h2>
            
            <form>
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" placeholder="Name of the vale">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" placeholder="Full description of the vale"></textarea>
                    </div>

                    <div>
                        <div class="form-group">
                            <label class="form-label">Type of reward</label>
                            <select class="form-select">
                                <option>Select</option>
                                <option>FREE</option>
                                <option>Discount</option>
                                <option>2X1</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Points needed</label>
                            <input type="number" class="form-input" placeholder="0">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Short Identifier</label>
                        <input type="text" class="form-input" placeholder="Short identifier from docume...">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Associated product</label>
                        <select class="form-select">
                            <option>Select</option>
                            <option>Bacon Bagel</option>
                            <option>Salmon Bagel</option>
                            <option>Morning Bagel</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="save-button">Save</button>
            </form>
        </div>
    </div>


    <!-- Pantalla principal -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="../img/logo.png" alt="Bagels & Bagels" class="logo">
            <div class="nav-buttons">
                <button class="nav-btn inactive">Inventory</button>
                <button class="nav-btn active">Rewards</button>
            </div>
        </div>

        <!-- Rewards Grid -->
        <div class="rewards-grid">
            <!-- 2X1 Bacon Bagel -->
            <div class="reward-card">
                <button class="edit-btn">
                    <img src="../img/edit.svg" alt="Edit">
                </button>
                <div class="reward-main-text">2X1<br><span style="font-size: 38px;">Bacon Bagel</span></div>
            </div>

            <!-- FREE Iced Latte -->
            <div class="reward-card">
                <button class="edit-btn">
                    <img src="../img/edit.svg" alt="Edit">
                </button>
                <div class="reward-main-text">FREE<br><span style="font-size: 38px;">Iced Latte</span></div>
                <div class="reward-description">With the purchase<br>of any bagel</div>
            </div>

            <!-- FREE Bigñets -->
            <div class="reward-card">
                <button class="edit-btn">
                    <img src="../img/edit.svg"alt="Edit">
                </button>
                <div class="reward-main-text">FREE<br><span style="font-size: 38px;">Bigñets</span></div>
            </div>

            <!-- 50% discount -->
            <div class="reward-card">
                <button class="edit-btn">
                    <img src="../img/edit.svg" alt="Edit">
                </button>
                <div class="reward-main-text">50%<br><span style="font-size: 38px;">discount</span></div>
                <div class="reward-description">Any combo</div>
            </div>

            <!-- Add Reward -->
            <div class="add-reward-card" onclick="openModal()">
                <div class="add-icon-large">+</div>
            </div>
        </div>
    </div>

      <script>
        function openModal() {
            document.getElementById('newValeModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('newValeModal').classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('newValeModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

</body>
</html>
