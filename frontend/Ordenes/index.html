    <link rel="stylesheet" href="style.css" />

    <div class="container">
        <!-- Order Card 1 -->
        <div class="order-card">
            <div class="order-header">
                <h2>Order</h2>
                <p>#01</p>
            </div>
            
            <div class="divider"></div>
            
            <div class="order-items">
                <div class="order-item">
                    <img class="item-image" src="img/bacon-bagel-10.png" alt="Bigol Bagel">
                    <div class="item-details">
                        <div class="item-name">Bigol Bagel</div>
                        <div class="item-quantity">x 2</div>
                        <div class="item-price">$12.00</div>
                    </div>
                </div>
                
                <div class="divider"></div>
                
                <div class="order-item">
                    <img class="item-image" src="img/laika-bagel-3.png" alt="Laika Bagel">
                    <div class="item-details">
                        <div class="item-name">Laika Bagel</div>
                        <div class="item-quantity">x 1</div>
                        <div class="item-price">$10.00</div>
                    </div>
                </div>
                
                <div class="divider"></div>
                
                <div class="order-item">
                    <img class="item-image" src="img/bacon-bagel-11.png" alt="Oreo Frappuccino">
                    <div class="item-details">
                        <div class="item-name">Oreo<br>Frappuccino</div>
                        <div class="item-quantity">x 1</div>
                        <div class="item-price">$5.00</div>
                    </div>
                </div>
            </div>
            
            <div class="order-footer">
                <div class="total-section">
                    <span class="total-label">Total</span>
                    <span class="total-amount">$27.00</span>
                </div>
                <button class="finish-button">Finish</button>
            </div>
        </div>
