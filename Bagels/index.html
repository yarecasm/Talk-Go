<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="global.css" />
  <title>Bagel Ordering</title>
</head>
<body>
  <div class="main-container">

    <!-- Columna 1: Menú y navegación -->
    <div class="menu-column">

      <!-- Botón de regresar como imagen -->
      <img src="img/back-icon.svg" alt="Back" class="backButton" />

      <!-- Botón de asistente virtual -->
      <div class="virtual-assistant">
        <img src="img/assistant-icon.svg" alt="Assistant" />
        <span>Virtual Assistant</span>
      </div>

      <!-- Navegación de categorías -->
      <nav class="category-nav">
        <button class="category-button active">Bagels</button>
        <button class="category-button">Drinks</button>
        <button class="category-button">Snacks</button>
      </nav>

      <!-- Galería de productos -->
      <div class="product-gallery">
        <button class="product-card" data-name="Bacon Bagel" data-price="7" data-img="img/bacon-bagel-1.png">
          <img src="img/bacon-bagel-1.png" alt="Bacon Bagel" />
          <div class="product-name">Bacon Bagel</div>
          <div class="product-price">$7.00</div>
        </button>
        <button class="product-card" data-name="Salmon Bagel" data-price="10" data-img="img/salmon-bagel.png">
          <img src="img/salmon-bagel.png" alt="Salmon Bagel" />
          <div class="product-name">Salmon Bagel</div>
          <div class="product-price">$10.00</div>
        </button>
        <button class="product-card" data-name="Morning Bagel" data-price="6" data-img="img/morning-bagel.png">
          <img src="img/morning-bagel.png" alt="Morning Bagel" />
          <div class="product-name">Morning Bagel</div>
          <div class="product-price">$6.00</div>
        </button>
        <button class="product-card" data-name="Bigol Bagel" data-price="10" data-img="img/bigol-bagel.png">
          <img src="img/bigol-bagel.png" alt="Bigol Bagel" />
          <div class="product-name">Bigol Bagel</div>
          <div class="product-price">$10.00</div>
        </button>
        <button class="product-card" data-name="Odi Bagel" data-price="7" data-img="img/odi-bagel.png">
          <img src="img/odi-bagel.png" alt="Odi Bagel" />
          <div class="product-name">Odi Bagel</div>
          <div class="product-price">$7.00</div>
        </button>
        <button class="product-card" data-name="Xolo Bagel" data-price="10" data-img="img/xolo-bagel.png">
          <img src="img/xolo-bagel.png" alt="Xolo Bagel" />
          <div class="product-name">Xolo Bagel</div>
          <div class="product-price">$10.00</div>
        </button>
      </div>
    </div>

    <!-- Columna 2: Resumen de orden -->
    <div class="order-column">
      <h2>My Order</h2>
      <div id="order-items"></div>
      <div class="order-total">
        <strong>Total:</strong> $<span id="order-total">0.00</span>
      </div>
      <button class="order-button">ORDER</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
